services:
  mcp-server:
    build:
      context: .
      dockerfile: tests/mcp_test_server.Dockerfile
    ports:
      - "8000:8000"
    networks:
      - mcpguard-net

  proxy:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    command: >
      proxy --target http://mcp-server:8000 --host 0.0.0.0 --port 8080
    depends_on:
      - mcp-server
    networks:
      - mcpguard-net

networks:
  mcpguard-net:
