<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPGuard Dashboard</title>
<script src="https://unpkg.com/htmx.org@1.9.10" onerror="this.src='/static/htmx.min.js'"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="this.src='/static/chart.min.js'"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
h1 small { font-size: 0.8rem; color: #64748b; font-weight: normal; }
h2 { font-size: 1.1rem; margin-bottom: 10px; color: #94a3b8; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
.card { background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; position: relative; }
.card .value { font-size: 2rem; font-weight: bold; color: #38bdf8; font-variant-numeric: tabular-nums; }
.card .label { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
.card.danger .value { color: #f87171; }
.card.warning .value { color: #fbbf24; }
.card.success .value { color: #4ade80; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #334155; color: #64748b; font-weight: 600; }
td { padding: 8px 10px; border-bottom: 1px solid #1e293b; }
tr:hover td { background: #1a2744; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.badge.high { background: #7f1d1d; color: #fca5a5; }
.badge.medium { background: #713f12; color: #fde68a; }
.badge.low { background: #1e3a5f; color: #93c5fd; }
.badge.info { background: #14532d; color: #86efac; }
.events-panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 20px; max-height: 350px; overflow-y: auto; }
.events-panel::-webkit-scrollbar { width: 6px; }
.events-panel::-webkit-scrollbar-track { background: #1e293b; }
.events-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
.section-title { margin: 20px 0 10px; color: #94a3b8; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.chart-container { background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; margin-bottom: 20px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.ok { background: #4ade80; }
.status-dot.warn { background: #fbbf24; }
.status-dot.err { background: #f87171; }
.toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
.filter-btn:hover { border-color: #38bdf8; color: #38bdf8; }
.filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
</style>
</head>
<body>
<h1>MCPGuard <small>Security Dashboard</small></h1>

<div class="toolbar">
  <button class="filter-btn active" data-filter="all">All Events</button>
  <button class="filter-btn" data-filter="high">High Severity</button>
  <button class="filter-btn" data-filter="medium">Medium</button>
  <button class="filter-btn" data-filter="low">Low</button>
</div>

<div class="grid" hx-get="/metrics" hx-trigger="every 3s" hx-swap="outerHTML">
  <div id="metrics"><p style="color:#64748b;">Loading metrics...</p></div>
</div>

<div class="section-title">Tool Activity</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
  <div class="chart-container">
    <h2>Tool Calls Distribution</h2>
    <canvas id="toolChart"></canvas>
  </div>
  <div class="chart-container">
    <h2>Security Events Over Time</h2>
    <canvas id="timelineChart"></canvas>
  </div>
</div>

<div class="section-title">Recent Security Events</div>
<div class="events-panel" id="events-list" hx-get="/events" hx-trigger="every 3s" hx-swap="innerHTML">
  <p style="color:#64748b;">Loading events...</p>
</div>

<script>
let toolChartInstance = null;
let timelineChartInstance = null;
let timelineData = [];

async function loadToolChart() {
  try {
    const res = await fetch('/api/tools');
    const data = await res.json();
    const ctx = document.getElementById('toolChart').getContext('2d');
    if (toolChartInstance) toolChartInstance.destroy();
    toolChartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: Object.keys(data),
        datasets: [{
          label: 'Calls',
          data: Object.values(data),
          backgroundColor: '#38bdf8',
          borderColor: '#0ea5e9',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { color: '#94a3b8', stepSize: 1 } },
          x: { ticks: { color: '#94a3b8', maxRotation: 45 } }
        }
      }
    });
  } catch(e) { console.error('Chart error:', e); }
}

async function loadTimelineChart() {
  try {
    const res = await fetch('/api/timeline');
    const point = await res.json();
    timelineData.push(point);
    if (timelineData.length > 30) timelineData.shift();
    const ctx = document.getElementById('timelineChart').getContext('2d');
    if (timelineChartInstance) timelineChartInstance.destroy();
    timelineChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: timelineData.map((_, i) => i),
        datasets: [
          { label: 'Requests', data: timelineData.map(d => d.total), borderColor: '#38bdf8', tension: 0.3, fill: false },
          { label: 'Blocked', data: timelineData.map(d => d.blocked), borderColor: '#f87171', tension: 0.3, fill: false },
          { label: 'Injection', data: timelineData.map(d => d.injections), borderColor: '#fbbf24', tension: 0.3, fill: false },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 12 } } },
        scales: {
          y: { beginAtZero: true, ticks: { color: '#94a3b8' } },
          x: { display: false }
        }
      }
    });
  } catch(e) { /* first call may fail */ }
}

loadToolChart();
loadTimelineChart();
setInterval(loadToolChart, 5000);
setInterval(loadTimelineChart, 3000);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('#events-list tr').forEach(row => {
      if (filter === 'all') {
        row.style.display = '';
      } else {
        const badge = row.querySelector('.badge');
        row.style.display = badge && badge.classList.contains(filter) ? '' : 'none';
      }
    });
  });
});
</script>
</body>
</html>
